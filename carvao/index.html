<style>
/* Layout: backyard churrasco. Header with mood + mic meter, stage with the grill and Seu Jacinto, 2x5 action grid */
:root{
  --bg:#ffd9b0; --sky:#ffc77a; --sky2:#ff9a5c; --ground:#9c6b3f; --fg:#3b2112; --accent:#e6462e;
  --panel:#fff3e2; --shadow:rgba(80,30,0,.28); --grill:#2b2b2b; --grill2:#444;
  --display:'Baloo 2','Comic Sans MS',cursive; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#2a1a22; --sky:#3a2340; --sky2:#6b2f3a; --ground:#4a3020; --fg:#ffe9d2; --panel:#3d2a33; --shadow:rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#2a1a22; --sky:#3a2340; --sky2:#6b2f3a; --ground:#4a3020; --fg:#ffe9d2; --panel:#3d2a33; --shadow:rgba(0,0,0,.5); color-scheme:dark }
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;box-sizing:border-box;
  background:linear-gradient(var(--sky) 0 45%,var(--sky2) 45% 66%,var(--ground) 66% 100%)}
header{display:flex;flex-direction:column;gap:4px}
#hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:1.35rem;font-weight:800}
#mood{font-size:.78rem;font-weight:700;background:var(--panel);padding:4px 12px;border-radius:999px;box-shadow:0 2px 0 var(--shadow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter{height:5px;border-radius:3px;background:var(--panel);overflow:hidden;opacity:0;transition:opacity .2s}
#meter.on{opacity:1}
#meter i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);transition:transform .06s linear}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
#grill{position:absolute;left:4%;bottom:8%;width:92px;height:110px;pointer-events:none}
#grill .box{position:absolute;left:0;right:0;top:40px;height:36px;background:var(--grill);border-radius:8px 8px 4px 4px;box-shadow:inset 0 6px 0 var(--grill2)}
#grill .leg{position:absolute;top:74px;width:6px;height:34px;background:var(--grill);border-radius:3px}
#grill .leg.l{left:12px}#grill .leg.r{right:12px}
#grill .fire{position:absolute;left:50%;top:44px;transform:translate(-50%,-100%) scale(0);transform-origin:50% 100%;font-size:2.6rem;line-height:1;transition:transform .3s}
#grill.lit .fire{transform:translate(-50%,-100%) scale(1);animation:flicker .35s ease-in-out infinite alternate}
@keyframes flicker{from{transform:translate(-50%,-100%) scale(1) rotate(-4deg)}to{transform:translate(-50%,-100%) scale(1.12) rotate(4deg)}}
#catbox{position:relative;display:flex;justify-content:center;max-width:100%;transform-origin:50% 100%;will-change:transform}
#catwrap{display:flex}
#cat{width:min(88vw,340px);height:auto;max-height:min(62vh,420px);touch-action:none;cursor:pointer;filter:drop-shadow(0 10px 6px var(--shadow))}
#bubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:18px;z-index:3;max-width:92%;
  font-family:var(--display);font-weight:800;font-size:1.2rem;box-shadow:0 3px 0 var(--shadow);opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0;transform:translateX(-50%)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fx{position:absolute;font-size:2rem;animation:fly 1.1s ease-out forwards}
.fx.slow{animation-duration:2.2s}
@keyframes fly{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-140px) scale(1.3);opacity:0}}
#item{position:absolute;bottom:34%;left:50%;font-size:3.4rem;transform:translateX(-50%);display:none;pointer-events:none;z-index:2}
#bigfire{position:absolute;left:16%;bottom:20%;transform:translateX(-50%) scale(.4);transform-origin:50% 100%;font-size:5rem;line-height:1;display:none;pointer-events:none;filter:drop-shadow(0 0 18px #ff8a3d)}
#skewers{position:absolute;inset:0;overflow:hidden;display:none}
.sk{position:absolute;top:-60px;font-size:2.6rem;line-height:1;cursor:pointer;touch-action:none;filter:drop-shadow(0 3px 2px var(--shadow));will-change:transform}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
#bar-home{grid-template-columns:repeat(6,1fr)}
#lake{position:absolute;inset:0;z-index:2;touch-action:none;cursor:pointer;overflow:hidden}#lake svg{width:100%;height:100%;display:block}
#lake .hd{transform-box:fill-box;transform-origin:50% 100%}#lake .hd.talk{animation:talk .5s ease-in-out 3}
@keyframes talk{50%{transform:rotate(-5deg) translateY(-4px)}}
#bubble.wrap{white-space:normal;text-overflow:clip;font-size:1rem;width:max-content;max-width:88%;text-align:center}
#bubble{z-index:4}
#bar-game{grid-template-columns:1fr 2fr}
.bar button,.pill{border:0;border-radius:14px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;
  font-size:clamp(.62rem,2.5vw,.85rem);padding:6px 2px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.15}
.bar button{cursor:pointer}
.bar button span{font-size:clamp(1.2rem,5.5vw,1.6rem)}
.pill{font-size:1.05rem;font-variant-numeric:tabular-nums}
.bar button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.bar button:focus-visible{outline:3px solid var(--accent)}
#b-mic.wait{opacity:.6}
#b-mic.on{background:var(--accent);color:#fff}
#b-mic.on b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:pulse 1s infinite}
#b-mic.rec{background:#b3261e;color:#fff}
@keyframes pulse{50%{opacity:.15}}
/* ---- sprite frames and states ---- */
.g{transform-box:fill-box;transform-origin:center}
#body{transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.015)}}
.fr{display:none}
#cat.idle #f-idle,#cat.talk #f-idle,#cat.dance #f-idle,#cat.listen #f-idle,#cat.cook #f-idle{display:block}
#cat.laugh #f-laugh,#cat.eat #f-laugh,#cat.yawn #f-laugh,#cat.cheer #f-laugh{display:block}
#cat.happy #f-happy,#cat.shy #f-happy,#cat.shake #f-happy{display:block}
#cat.ouch #f-ouch,#cat.sneeze #f-ouch{display:block}
#cat.sleep #f-sleep,#cat.blink #f-sleep{display:block}
#cat.blink #f-idle{display:none}
#cat.dizzy #f-dizzy{display:block}
#cat.talk #f-laugh{display:block;animation:flip .22s steps(1,end) infinite}
#cat.dance #f-happy{display:block;animation:flip .9s steps(1,end) infinite}
@keyframes flip{0%{opacity:1}50%{opacity:0}}
#stache{display:none}#cat.stache #stache{display:block}
#cat.laugh #body,#cat.cheer #body{animation:bounce .18s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) scaleX(1.03)}}
#cat.ouch{animation:jump .5s ease-out}
@keyframes jump{30%{transform:translateY(-40px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
#cat.happy #head{animation:nuzzle .6s ease-in-out infinite}
@keyframes nuzzle{50%{transform:rotate(5deg)}}
#cat.sleep{filter:drop-shadow(0 10px 6px var(--shadow)) brightness(.8)}
#cat.sneeze #head{animation:sneeze .5s ease-out}
@keyframes sneeze{40%{transform:rotate(-8deg) translateY(-6px)}70%{transform:rotate(10deg) translateY(10px)}}
#cat.eat #head{animation:chomp .25s ease-in-out infinite}
@keyframes chomp{50%{transform:translateY(5px)}}
#cat.listen #head{animation:tilt .7s ease-in-out infinite alternate}
@keyframes tilt{to{transform:rotate(-6deg)}}
#cat.talk #head{animation:bob .3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#cat.dance #body{animation:sway .45s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg) translateX(-6px)}to{transform:rotate(6deg) translateX(6px)}}
#cat.dance #head{animation:bob .45s ease-in-out infinite}
#cat.shake{animation:shake .11s linear infinite}
@keyframes shake{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
#cat.dizzy #head{animation:wobble .45s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-8deg) translateX(-4px)}50%{transform:rotate(8deg) translateX(4px)}}
#cat.cook #head{animation:fan .3s ease-in-out infinite alternate}
@keyframes fan{to{transform:rotate(4deg) translateX(6px)}}
#cat.shy #head{animation:tilt .5s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

(function(){

function buildCtx(){ try{ const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; const c=new C();

function setSession(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }

/* ================= microphone: auto-listen or hold-to-talk, repeat in a deep voice ================= */
function noMic(msg){ say('Sem microfone 🙈',1600,''); mood.textContent=msg; }
async function micToggle(){
  if(stream){ micOff(); return; }
  audio();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ noMic('abra o link no Safari ou Chrome'); return; }
  micBtn.classList.add('wait'); mood.textContent='pedindo o microfone…';
  setSession('play-and-record');
  let s;
  try{ s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}); }
  catch(e){ micBtn.classList.remove('wait'); setSession('playback'); noMic(e&&e.name==='NotAllowedError'?'microfone não liberado':'microfone indisponível'); return; }
  stream=s; audio();
  try{
    msrc=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(2048,1,1); mute=ac.createGain(); mute.gain.value=0;
    msrc.connect(proc); proc.connect(mute); mute.connect(ac.destination); proc.onaudioprocess=onAudio;
  }catch(e){ micBtn.classList.remove('wait'); micOff(); noMic('microfone indisponível'); return; }
  listening=true; pre=[]; floor=0.01; micBtn.classList.remove('wait'); micBtn.classList.add('on'); micLabel.textContent='Ouvindo'; meter.classList.add('on');
  mood.textContent='fale com o Seu Jacinto!'; say('Fala comigo! 🎤',1500,'Fala comigo!');
  setTimeout(function(){ if(stream&&ac&&ac.state!=='running'){ audio(); mood.textContent='toque nele para ligar o som'; } },400);
}
function micOff(){ listening=false; manual=false; rec=null;
  try{ stream.getTracks().forEach(function(t){t.stop()}); }catch(e){} stream=null;
  try{ proc.disconnect(); msrc.disconnect(); mute.disconnect(); }catch(e){} proc=msrc=mute=null;
  setSession('playback'); meter.classList.remove('on'); meterBar.style.transform='scaleX(0)';
  micBtn.classList.remove('on','wait','rec'); micLabel.textContent='Falar'; cat.classList.remove('listen'); mood.textContent=MOOD; }
let holdT=null,held=false;
micBtn.addEventListener('pointerdown',function(ev){ if(ev.pointerType==='mouse'&&ev.button!==0)return; held=false; clearTimeout(holdT);
  if(!stream)return; holdT=setTimeout(function(){ held=true; manual=true; rec=[]; voiced=0; micBtn.classList.add('rec'); cat.classList.add('listen'); mood.textContent='pode falar…'; },350); });
function holdEnd(){ clearTimeout(holdT); if(manual){ manual=false; micBtn.classList.remove('rec'); if(rec&&rec.length)finish(true); else { rec=null; cat.classList.remove('listen'); } } }
micBtn.addEventListener('pointerup',holdEnd); micBtn.addEventListener('pointercancel',holdEnd); micBtn.addEventListener('pointerleave',holdEnd);
micBtn.addEventListener('click',function(){ if(held){ held=false; return; } micToggle(); });
function onAudio(e){
  const d=e.inputBuffer.getChannelData(0); let s=0; for(let i=0;i<d.length;i+=4)s+=d[i]*d[i]; const rms=Math.sqrt(s/(d.length/4));
  const now=performance.now(); if(now-lastMeter>60){ lastMeter=now; meterBar.style.transform='scaleX('+Math.min(1,rms*5)+')'; }
  if(manual){ if(rec){ rec.push(new Float32Array(d)); voiced++; } return; }
  if(!listening||playing||speaking||now<quietUntil){ if(rec){ rec=null; cat.classList.remove('listen'); } speech=0; return; }
  const thr=Math.max(0.015,floor*2.5);
  if(!rec){
    pre.push(new Float32Array(d)); if(pre.length>3)pre.shift();
    if(rms>thr){ speech++; if(speech>=2){ rec=pre.slice(); pre=[]; silence=0; voiced=speech; cat.classList.add('listen'); mood.textContent='ouvindo você…'; } }
    else { speech=0; floor=floor*0.95+rms*0.05; }
  } else {
    rec.push(new Float32Array(d));
    if(rms<thr*0.6){ silence++; } else { silence=0; voiced++; }
    if(silence>=16) finish(false); else if(rec.length>=180) finish(true);
  }
}
function finish(byMax){ const chunks=rec; rec=null; speech=0; silence=0; cat.classList.remove('listen');
  if(!chunks||voiced<4){ mood.textContent='fale com o Seu Jacinto!'; return; }
  const keep=byMax?chunks.length:Math.max(4,chunks.length-12);
  let len=0; for(let i=0;i<keep;i++)len+=chunks[i].length;
  let buf; try{ buf=ac.createBuffer(1,len,ac.sampleRate); }catch(e){ return; }
  const out=buf.getChannelData(0); let off=0; for(let i=0;i<keep;i++){ out.set(chunks[i],off); off+=chunks[i].length; }
  let peak=0; for(let i=0;i<len;i++){ const v=Math.abs(out[i]); if(v>peak)peak=v; }
  if(peak>0.001&&peak<0.7){ const g=0.7/peak; for(let i=0;i<len;i++)out[i]*=g; }
  playBack(buf);
}
function playBack(buf){ audio(); const RATE=.75; let src; try{ src=ac.createBufferSource(); src.buffer=buf; src.playbackRate.value=RATE;
    const g=ac.createGain(); g.gain.value=1.3; src.connect(g); g.connect(master); src.start(); }catch(e){ return; }
  playing=true; busy=true; clearTimeout(timer); setCls('talk'); mood.textContent='repetindo! 😄'; spawnMid('🎶',3);
  const dur=buf.duration/RATE; let ended=false;
  function done(){ if(ended)return; ended=true; playing=false; busy=false; setCls('idle'); quietUntil=performance.now()+500; mood.textContent='fale com o Seu Jacinto!'; }
  src.onended=done; setTimeout(done,dur*1000+250);
}
