<style>
/* Layout: one-screen playroom, cat centered, action bar pinned at bottom */
:root{
  --bg:#ffe8c2; --wall:#ffd59a; --floor:#f2b56b; --fg:#4a2a12; --accent:#ff7a3d;
  --fur:#ff9d3a; --fur2:#e8832a; --cream:#fff2dc; --pink:#ff8fa3; --panel:#fff6e6; --shadow:rgba(90,40,0,.25);
  --display:'Baloo 2','Comic Sans MS',cursive; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#2b1d3a; --wall:#3a2a52; --floor:#5a3a4a; --fg:#ffe9d2; --panel:#3d2e55; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#2b1d3a; --wall:#3a2a52; --floor:#5a3a4a; --fg:#ffe9d2; --panel:#3d2e55; --shadow:rgba(0,0,0,.45); color-scheme:dark }
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;box-sizing:border-box;
  background:linear-gradient(var(--wall) 0 62%,var(--floor) 62% 100%)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:1.4rem;font-weight:800}
#mood{font-size:.8rem;font-weight:700;background:var(--panel);padding:4px 12px;border-radius:999px;box-shadow:0 2px 0 var(--shadow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
#cat{width:min(92vw,380px);max-height:100%;touch-action:none;cursor:pointer;filter:drop-shadow(0 10px 6px var(--shadow))}
#bubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:18px;
  font-family:var(--display);font-weight:800;font-size:1.3rem;box-shadow:0 3px 0 var(--shadow);opacity:0;transition:opacity .2s;white-space:nowrap}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0;transform:translateX(-50%)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fx{position:absolute;font-size:2rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.3);opacity:0}}
#item{position:absolute;bottom:38%;left:50%;font-size:3.2rem;transform:translateX(-50%);display:none;pointer-events:none}
#bar{display:flex;gap:6px;justify-content:center;padding-top:8px}
#bar button{flex:1;max-width:100px;min-width:0;border:0;border-radius:16px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;
  font-size:clamp(.72rem,2.8vw,.95rem);padding:8px 2px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.2}
#bar button span{font-size:clamp(1.3rem,6vw,1.7rem)}
#bar button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
#bar button:focus-visible{outline:3px solid var(--accent)}
#b-mic.wait{opacity:.6}
#b-mic.on{background:var(--accent);color:#fff}
#b-mic.on b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.15}}
/* cat animation states */
.g{transform-box:fill-box;transform-origin:center}
#body{transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.02)}}
#tail{transform-origin:100% 90%;animation:wag 2.2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
#ears{transition:transform .2s}
.eye-lid{transform-origin:50% 0;transform:scaleY(0);transition:transform .12s}
#cat.blink .eye-lid,#cat.happy .eye-lid,#cat.sleep .eye-lid{transform:scaleY(1)}
#mouth-smile,#mouth-open,#mouth-flat,#mouth-ooh{display:none}
#cat.idle #mouth-smile,#cat.happy #mouth-smile{display:block}
#cat.laugh #mouth-open,#cat.eat #mouth-open{display:block}
#cat.ouch #mouth-ooh{display:block}
#cat.sleep #mouth-flat{display:block}
#cat.laugh #body{animation:bounce .18s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) scaleX(1.03)}}
#cat.ouch{animation:jump .5s ease-out}
@keyframes jump{30%{transform:translateY(-40px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
#cat.ouch #tail{animation:none;transform:rotate(-40deg)}
#cat.ouch #ears{transform:translateY(8px)}
#cat.happy #head{animation:nuzzle .6s ease-in-out infinite}
@keyframes nuzzle{50%{transform:rotate(6deg)}}
#cat.sleep{filter:drop-shadow(0 10px 6px var(--shadow)) brightness(.8)}
#cat.sleep #body{animation:breathe 4s ease-in-out infinite}
#cat.sneeze #head{animation:sneeze .5s ease-out}
@keyframes sneeze{40%{transform:rotate(-10deg) translateY(-6px)}70%{transform:rotate(12deg) translateY(10px)}}
#cat.eat #head{animation:chomp .25s ease-in-out infinite}
@keyframes chomp{50%{transform:translateY(5px)}}
#cat.listen #ears{transform:translateY(-9px)}
#cat.listen #head{animation:tilt .7s ease-in-out infinite alternate}
@keyframes tilt{to{transform:rotate(-7deg)}}
#mouth-open{transform-box:fill-box;transform-origin:50% 0}
#cat.talk #mouth-open{display:block;animation:talk .22s steps(1,end) infinite}
@keyframes talk{0%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
#cat.talk #head{animation:bob .3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

<div id="app">

<script>
(function(){
const $=function(id){return document.getElementById(id)};
const cat=$('cat'),bubble=$('bubble'),mood=$('mood'),fx=$('fx'),item=$('item'),stage=$('stage'),micBtn=$('b-mic'),micLabel=micBtn.querySelector('b'),silent=$('silent');
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
let ac=null,master=null,busy=false,sleeping=false,timer=null,quietUntil=0,wl=null;
let stream=null,msrc=null,proc=null,mute=null,listening=false,playing=false,rec=null,pre=[],speech=0,silence=0,voiced=0,floor=0.01;

/* ---------- audio core: unlock on gesture END (iOS), ignore the silent switch ---------- */
function buildCtx(){ try{ const C=window.AudioContext||window.webkitAudioContext; if(!C)return null; const c=new C();
  const g=c.createGain(); g.gain.value=1; const comp=c.createDynamicsCompressor(); comp.threshold.value=-10; comp.ratio.value=6;
  g.connect(comp); comp.connect(c.destination); ac=c; master=g; }catch(e){ ac=null; } return ac; }
function audio(){ if(!ac)buildCtx(); if(ac&&ac.state!=='running'){ try{ ac.resume().catch(function(){}); }catch(e){} } return ac; }
function setSession(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }
function unlock(){ const a=audio(); if(!a)return;
  try{ const s=a.createBufferSource(); s.buffer=a.createBuffer(1,1,22050); s.connect(a.destination); s.start(0); }catch(e){}
  if(!stream) setSession('playback');
  if(isIOS&&silent.paused){ try{ const p=silent.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} }
  if(!wl&&navigator.wakeLock){ try{ navigator.wakeLock.request('screen').then(function(l){ wl=l; l.addEventListener('release',function(){wl=null;}); }).catch(function(){}); }catch(e){} }
}
['pointerup','touchend','click','keyup'].forEach(function(t){ document.addEventListener(t,unlock,{passive:true}); });

function tone(f1,f2,dur,type,vol,delay){ const a=audio(); if(!a)return; const d=delay||0,t=a.currentTime+d;
  try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'triangle';
    o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.4,t+.03); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05); }catch(e){}
  quietUntil=Math.max(quietUntil,performance.now()+(d+dur)*1000+350); }
const snd={
  meow:function(){ tone(520,780,.18,'sawtooth',.35); tone(780,420,.45,'sawtooth',.35,.18); },
  purr:function(){ for(let i=0;i<10;i++)tone(60,55,.08,'square',.2,i*.09); },
  giggle:function(){ for(let i=0;i<5;i++)tone(600+i*40,900+i*40,.1,'triangle',.4,i*.13); },
  ouch:function(){ tone(900,300,.3,'sawtooth',.45); },
  chomp:function(){ for(let i=0;i<4;i++)tone(200,120,.08,'square',.3,i*.25); },
  sneeze:function(){ tone(300,900,.15,'sawtooth',.4); tone(700,200,.3,'sawtooth',.45,.15); },
  snore:function(){ tone(90,140,.6,'sine',.35); tone(140,80,.6,'sine',.25,.7); },
  boing:function(){ tone(300,700,.25,'triangle',.4); },
  burp:function(){ tone(150,90,.35,'sawtooth',.45); }
};

/* ---------- cat behaviour ---------- */
function say(txt,ms){ bubble.textContent=txt; bubble.classList.add('on'); clearTimeout(bubble._t); bubble._t=setTimeout(function(){bubble.classList.remove('on')},ms||1200); }
function spawn(emoji,x,y,n){ for(let i=0;i<(n||1);i++){ const e=document.createElement('div'); e.className='fx'; e.textContent=emoji;
  e.style.left=(x+(Math.random()*80-40))+'px'; e.style.top=(y+(Math.random()*30-15))+'px'; fx.appendChild(e); setTimeout(function(){e.remove()},1200);} }
function restState(){ return sleeping?'sleep':'idle'; }
function setState(s,ms,done){ busy=true; cat.className=s; clearTimeout(timer); timer=setTimeout(function(){ cat.className=restState(); busy=false; if(done)done(); },ms); }
function wake(){ if(sleeping){ sleeping=false; cat.className='idle'; mood.textContent='acordei!'; say('Hmm?! 😾',900); snd.meow(); return true;} return false; }
const reactions={
  head:function(){ say('Prrrr… 😽'); mood.textContent='amando carinho'; snd.purr(); setState('happy',1300); },
  belly:function(){ say('Hahaha! 🤣'); mood.textContent='cócegas!'; snd.giggle(); setState('laugh',1100); },
  paw:function(){ say('Hihihi! 😹'); mood.textContent='cócegas no pé'; snd.giggle(); setState('laugh',800); },
  tail:function(){ say('MIAAAU! 😾'); mood.textContent='ai, meu rabo!'; snd.ouch(); setState('ouch',900); },
  nose:function(){ say('A-a-ATCHIM! 🤧'); mood.textContent='espirrou'; snd.sneeze(); setState('sneeze',700); },
  eye:function(){ say('Ei, meu olho! 🙀'); mood.textContent='pisca pisca'; snd.ouch(); setState('ouch',800); }
};
function hit(ev){ if(ev.pointerType==='mouse'&&ev.button!==0)return; ev.preventDefault(); audio();
  const el=document.elementFromPoint(ev.clientX,ev.clientY); const part=el&&el.closest('[data-part]'); if(!part)return;
  if(wake())return; if(busy)return; const r=stage.getBoundingClientRect(); const p=part.getAttribute('data-part');
  spawn(p==='tail'||p==='eye'?'💢':'💛',ev.clientX-r.left,ev.clientY-r.top,2); (reactions[p]||reactions.head)(); }
cat.addEventListener('pointerdown',hit);
stage.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});

function showItem(emoji,ms){ item.textContent=emoji; item.style.display='block'; setTimeout(function(){item.style.display='none'},ms); }
$('b-food').onclick=function(){ audio(); if(wake()||busy)return; mood.textContent='nham nham'; showItem('🐟',1500); snd.chomp();
  setState('eat',1500,function(){ say('BURP! 😸'); snd.burp(); const r=stage.getBoundingClientRect(); spawn('✨',r.width/2,r.height*.35,3); mood.textContent='satisfeito'; }); };
$('b-play').onclick=function(){ audio(); if(wake()||busy)return; mood.textContent='brincando'; showItem('🧶',1200); snd.boing(); say('Iuhuu! 😸'); setState('laugh',1200); };
$('b-sleep').onclick=function(){ audio(); if(sleeping){wake();return;} if(busy)return; sleeping=true; busy=false; rec=null; cat.className='sleep'; mood.textContent='dormindo… toque para acordar'; say('Zzz… 💤',2500); snd.snore(); };
$('b-meow').onclick=function(){ audio(); if(wake()||busy)return; say('MIAU! 🎵'); mood.textContent='cantando'; snd.meow(); setState('laugh',600); };

/* ---------- microphone: listen, record while you talk, repeat in a squeaky voice ---------- */
function noMic(msg){ say('Sem microfone 🙈',1600); mood.textContent=msg; }
function freshCtx(){ try{ if(ac){ const old=ac; ac=null; old.close().catch(function(){}); } }catch(e){} buildCtx(); audio(); }
async function micToggle(){
  if(stream){ micOff(); return; }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ noMic('microfone indisponível'); return; }
  micBtn.classList.add('wait'); mood.textContent='pedindo o microfone…';
  let s;
  try{ s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}); }
  catch(e){ micBtn.classList.remove('wait'); noMic(e&&e.name==='NotAllowedError'?'microfone não liberado':'microfone indisponível'); return; }
  stream=s; freshCtx(); setSession('play-and-record');
  try{
    msrc=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(2048,1,1); mute=ac.createGain(); mute.gain.value=0;
    msrc.connect(proc); proc.connect(mute); mute.connect(ac.destination); proc.onaudioprocess=onAudio;
  }catch(e){ micBtn.classList.remove('wait'); micOff(); noMic('microfone indisponível'); return; }
  listening=true; pre=[]; floor=0.01; micBtn.classList.remove('wait'); micBtn.classList.add('on'); micLabel.textContent='Ouvindo';
  mood.textContent='fale com o Bigode!'; say('Fala comigo! 🎤',1500); snd.meow();
}
function micOff(){ listening=false; rec=null;
  try{ stream.getTracks().forEach(function(t){t.stop()}); }catch(e){} stream=null;
  try{ proc.disconnect(); msrc.disconnect(); mute.disconnect(); }catch(e){} proc=msrc=mute=null;
  freshCtx(); setSession('playback');
  micBtn.classList.remove('on','wait'); micLabel.textContent='Falar'; cat.classList.remove('listen'); mood.textContent='toque no gato!'; }
micBtn.onclick=function(){ micToggle(); };

function onAudio(e){
  const d=e.inputBuffer.getChannelData(0); let s=0; for(let i=0;i<d.length;i+=4)s+=d[i]*d[i]; const rms=Math.sqrt(s/(d.length/4));
  if(!listening||playing||sleeping||performance.now()<quietUntil){ if(rec){ rec=null; cat.classList.remove('listen'); } speech=0; return; }
  const thr=Math.max(0.02,floor*3);
  if(!rec){
    pre.push(new Float32Array(d)); if(pre.length>3)pre.shift();
    if(rms>thr){ speech++; if(speech>=2){ rec=pre.slice(); pre=[]; silence=0; voiced=speech; cat.classList.add('listen'); mood.textContent='ouvindo você…'; } }
    else { speech=0; floor=floor*0.95+rms*0.05; }
  } else {
    rec.push(new Float32Array(d));
    if(rms<thr*0.6){ silence++; } else { silence=0; voiced++; }
    if(silence>=16) finish(false); else if(rec.length>=160) finish(true);
  }
}
function finish(byMax){ const chunks=rec; rec=null; speech=0; silence=0; cat.classList.remove('listen');
  if(voiced<5){ mood.textContent='fale com o Bigode!'; return; }
  const keep=byMax?chunks.length:Math.max(4,chunks.length-12);
  let len=0; for(let i=0;i<keep;i++)len+=chunks[i].length;
  let buf; try{ buf=ac.createBuffer(1,len,ac.sampleRate); }catch(e){ return; }
  const out=buf.getChannelData(0); let off=0; for(let i=0;i<keep;i++){ out.set(chunks[i],off); off+=chunks[i].length; }
  let peak=0; for(let i=0;i<len;i++){ const v=Math.abs(out[i]); if(v>peak)peak=v; }
  if(peak>0.001&&peak<0.7){ const g=0.7/peak; for(let i=0;i<len;i++)out[i]*=g; }
  playBack(buf);
}
function playBack(buf){ audio(); let src; try{ src=ac.createBufferSource(); src.buffer=buf; src.playbackRate.value=1.5;
    const g=ac.createGain(); g.gain.value=1.2; src.connect(g); g.connect(master); src.start(); }catch(e){ return; }
  playing=true; busy=true; clearTimeout(timer); cat.className='talk'; mood.textContent='repetindo! 😸';
  const r=stage.getBoundingClientRect(); spawn('🎶',r.width/2,r.height*.3,3);
  const dur=buf.duration/1.5; let ended=false;
  function done(){ if(ended)return; ended=true; playing=false; busy=false; cat.className=restState(); quietUntil=performance.now()+500; mood.textContent='fale com o Bigode!'; }
  src.onended=done; setTimeout(done,dur*1000+250);
}

/* ---------- idle life: blink, snore while asleep, occasional meow ---------- */
setInterval(function(){ if(sleeping){ snd.snore(); const s=stage.getBoundingClientRect(); spawn('💤',s.width*.6,s.height*.3,1); return;}
  if(!busy){ cat.classList.add('blink'); setTimeout(function(){cat.classList.remove('blink')},150);} },2800);
setInterval(function(){ if(!busy&&!sleeping&&!rec&&Math.random()<.35){ say('Miau? 🐾',900); snd.meow(); } },9000);
})();
</script>
