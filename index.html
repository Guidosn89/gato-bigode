<style>
/* Layout: one-screen playroom. Header with mood + mic meter, stage with the cat and game props, 2x4 action grid */
:root{
  --bg:#ffe8c2; --wall:#ffd59a; --floor:#f2b56b; --fg:#4a2a12; --accent:#ff7a3d;
  --fur:#ff9d3a; --fur2:#e8832a; --cream:#fff2dc; --pink:#ff8fa3; --panel:#fff6e6; --shadow:rgba(90,40,0,.25);
  --sky:#bfe6ff; --grass:#8fd15c;
  --display:'Baloo 2','Comic Sans MS',cursive; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#2b1d3a; --wall:#3a2a52; --floor:#5a3a4a; --fg:#ffe9d2; --panel:#3d2e55; --shadow:rgba(0,0,0,.45); --sky:#2c3e6b; --grass:#3f7a3a; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#2b1d3a; --wall:#3a2a52; --floor:#5a3a4a; --fg:#ffe9d2; --panel:#3d2e55; --shadow:rgba(0,0,0,.45); --sky:#2c3e6b; --grass:#3f7a3a; color-scheme:dark }
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 10px;box-sizing:border-box;
  background:linear-gradient(var(--wall) 0 62%,var(--floor) 62% 100%)}
#app.tramp,#app.goal{background:linear-gradient(var(--sky) 0 70%,var(--grass) 70% 100%)}
header{display:flex;flex-direction:column;gap:4px}
#hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:1.35rem;font-weight:800}
#mood{font-size:.78rem;font-weight:700;background:var(--panel);padding:4px 12px;border-radius:999px;box-shadow:0 2px 0 var(--shadow);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chars{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}#chars::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;font-size:.82rem;padding:5px 12px;box-shadow:0 2px 0 var(--shadow);cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip:focus-visible{outline:3px solid var(--accent)}
#meter{height:5px;border-radius:3px;background:var(--panel);overflow:hidden;opacity:0;transition:opacity .2s}
#meter.on{opacity:1}
#meter i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0);transition:transform .06s linear}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;justify-content:center;touch-action:none}
#catbox{position:relative;display:flex;justify-content:center;max-width:100%;transform-origin:50% 100%;will-change:transform}
#catbox.goalpos{transform:translateX(30%) scale(.78)}
#catwrap{display:flex}
#catwrap.hop{animation:hop .55s ease-out}
@keyframes hop{35%{transform:translateY(-130px) rotate(-8deg)}70%{transform:translateY(-20px) rotate(3deg)}}
#cat{width:min(88vw,340px);height:auto;max-height:min(62vh,420px);touch-action:none;cursor:pointer;filter:drop-shadow(0 10px 6px var(--shadow))}
#bubble{position:absolute;top:4%;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 16px;border-radius:18px;z-index:3;
  font-family:var(--display);font-weight:800;font-size:1.3rem;box-shadow:0 3px 0 var(--shadow);opacity:0;transition:opacity .2s;white-space:nowrap}
#bubble.on{opacity:1}
#bubble::after{content:"";position:absolute;left:50%;bottom:-8px;border:8px solid transparent;border-top-color:var(--panel);border-bottom:0;transform:translateX(-50%)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
.fx{position:absolute;font-size:2rem;animation:fly 1.1s ease-out forwards}
.fx.slow{animation-duration:2.2s}
@keyframes fly{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-140px) scale(1.3);opacity:0}}
#item{position:absolute;bottom:34%;left:50%;font-size:3.4rem;transform:translateX(-50%);display:none;pointer-events:none;z-index:2}
#tramp{position:absolute;bottom:14px;left:50%;width:min(72vw,300px);height:56px;transform:translateX(-50%);display:none}
#tramp .mat{position:absolute;left:0;right:0;top:0;height:34px;border-radius:50%;background:#5bb2ff;border:7px solid #e03a3a;box-sizing:border-box;box-shadow:inset 0 -6px 0 #2f86d6}
#tramp .leg{position:absolute;top:28px;width:7px;height:28px;background:#5a5a5a;border-radius:3px}
#tramp .leg.l{left:18%}#tramp .leg.r{right:18%}
#tramp.squash .mat{animation:squash .22s ease-out}
@keyframes squash{40%{transform:scaleY(.6) translateY(8px)}}
#goal{position:absolute;top:5%;left:50%;transform:translateX(-50%);font-size:5.4rem;line-height:1;display:none;pointer-events:none;filter:drop-shadow(0 4px 3px var(--shadow))}
#ball{position:absolute;bottom:22px;left:18%;font-size:3.2rem;line-height:1;display:none;cursor:pointer;touch-action:none;filter:drop-shadow(0 4px 3px var(--shadow));z-index:2}
.bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#bar-game{grid-template-columns:1fr 2fr}
.bar button,.pill{border:0;border-radius:16px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;
  font-size:clamp(.72rem,2.8vw,.95rem);padding:7px 2px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;line-height:1.2}
.bar button{cursor:pointer}
.bar button span{font-size:clamp(1.3rem,6vw,1.7rem)}
.pill{font-size:1.1rem;font-variant-numeric:tabular-nums}
.bar button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.bar button:focus-visible{outline:3px solid var(--accent)}
#b-mic.wait{opacity:.6}
#b-mic.on{background:var(--accent);color:#fff}
#b-mic.on b::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;margin-right:5px;animation:pulse 1s infinite}
#b-mic.rec{background:#e03a3a;color:#fff}
@keyframes pulse{50%{opacity:.15}}
/* ---- cat parts ---- */
.g{transform-box:fill-box;transform-origin:center}
#body{transform-origin:50% 100%;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.02)}}
#tail{transform-origin:100% 90%;animation:wag 2.2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(12deg)}}
#ears{transition:transform .2s}
.eye-lid{transform-origin:50% 0;transform:scaleY(0);transition:transform .12s}
#cat.blink .eye-lid,#cat.happy .eye-lid,#cat.sleep .eye-lid,#cat.yawn .eye-lid,#cat.shake .eye-lid,#cat.dizzy .eye-lid,#cat.milk .eye-lid{transform:scaleY(1)}
#mouth-smile,#mouth-open,#mouth-flat,#mouth-ooh,#eyes-x,#stache,#blush{display:none}
#cat.idle #mouth-smile,#cat.happy #mouth-smile,#cat.dance #mouth-smile,#cat.shy #mouth-smile,#cat.shake #mouth-smile{display:block}
#cat.laugh #mouth-open,#cat.eat #mouth-open,#cat.yawn #mouth-open,#cat.air #mouth-open,#cat.milk #mouth-open{display:block}
#cat.sleep #mouth-flat{display:block}
#cat.ouch #mouth-ooh,#cat.dizzy #mouth-ooh,#cat.sneeze #mouth-ooh{display:block}
#cat.dizzy #eyes-x{display:block}
#cat.shy #blush,#cat.dizzy #blush{display:block}
#cat.stache #stache{display:block}
#cat.laugh #body{animation:bounce .18s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px) scaleX(1.03)}}
#cat.ouch{animation:jump .5s ease-out}
@keyframes jump{30%{transform:translateY(-40px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
#cat.ouch #tail{animation:none;transform:rotate(-40deg)}
#cat.ouch #ears{transform:translateY(8px)}
#cat.happy #head{animation:nuzzle .6s ease-in-out infinite}
@keyframes nuzzle{50%{transform:rotate(6deg)}}
#cat.sleep{filter:drop-shadow(0 10px 6px var(--shadow)) brightness(.8)}
#cat.sleep #body{animation:breathe 4s ease-in-out infinite}
#cat.sneeze #head{animation:sneeze .5s ease-out}
@keyframes sneeze{40%{transform:rotate(-10deg) translateY(-6px)}70%{transform:rotate(12deg) translateY(10px)}}
#cat.eat #head{animation:chomp .25s ease-in-out infinite}
@keyframes chomp{50%{transform:translateY(5px)}}
#cat.milk #head{animation:drink .4s ease-in-out infinite}
@keyframes drink{50%{transform:translateY(-4px) rotate(-3deg)}}
#cat.yawn #head{animation:yawnhead .9s ease-in-out}
@keyframes yawnhead{50%{transform:translateY(-6px) rotate(-4deg)}}
#cat.listen #ears{transform:translateY(-9px)}
#cat.listen #head{animation:tilt .7s ease-in-out infinite alternate}
@keyframes tilt{to{transform:rotate(-7deg)}}
#mouth-open{transform-box:fill-box;transform-origin:50% 0}
#cat.talk #mouth-open{display:block;animation:talk .22s steps(1,end) infinite}
@keyframes talk{0%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
#cat.talk #head{animation:bob .3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
#cat.dance #body{animation:sway .45s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg) translateX(-6px)}to{transform:rotate(7deg) translateX(6px)}}
#cat.dance #head{animation:bob .45s ease-in-out infinite}
#cat.dance #tail{animation:wag .45s ease-in-out infinite}
#cat.shake{animation:shake .11s linear infinite}
@keyframes shake{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
#cat.dizzy #head{animation:wobble .45s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-9deg) translateX(-4px)}50%{transform:rotate(9deg) translateX(4px)}}
#cat.air #ears{transform:translateY(10px)}
#cat.air #tail{animation:none;transform:rotate(-30deg)}
#cat.shy #head{animation:tilt .5s ease-in-out infinite alternate}
/* ---- sprite characters (6 expression frames) ---- */
.fr{display:none}
#cat.idle #f-idle,#cat.talk #f-idle,#cat.dance #f-idle,#cat.listen #f-idle{display:block}
#cat.laugh #f-laugh,#cat.eat #f-laugh,#cat.air #f-laugh,#cat.yawn #f-laugh,#cat.milk #f-laugh{display:block}
#cat.happy #f-happy,#cat.shy #f-happy,#cat.shake #f-happy{display:block}
#cat.ouch #f-ouch,#cat.sneeze #f-ouch{display:block}
#cat.sleep #f-sleep,#cat.blink #f-sleep{display:block}
#cat.blink #f-idle{display:none}
#cat.dizzy #f-dizzy{display:block}
#cat.talk #f-laugh{display:block;animation:flip .22s steps(1,end) infinite}
#cat.dance #f-happy{display:block;animation:flip .9s steps(1,end) infinite}
@keyframes flip{0%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>

function restState(){ return sleeping?'sleep':'idle'; }
function setState(s,ms,done){ busy=true; setCls(s); clearTimeout(timer); clearTimeout(extraT); timer=setTimeout(function(){ setCls(restState()); busy=false; if(done)done(); },ms); }
function wake(){ if(sleeping){ sleeping=false; setCls('idle'); mood.textContent='acordei!'; say('Hmm?! 😾',900); V.hi(); return true;} return false; }
let bellyTaps=[],down=null;
const reactions={
  head:function(){ say(cur===CHARS.cat?'Prrrr… 😽':'Hmmm… 😊'); mood.textContent='amando carinho'; V.purr(); setState('happy',1300); },
  hair:function(){ say('Ai! Meu cabelo! 😠'); mood.textContent='não puxa!'; V.angry(); setState('ouch',900); },
  belly:function(){ say('Hahaha! 🤣'); mood.textContent='cócegas!'; snd.giggle(); setState('laugh',1100); },
  pum:function(){ say('PUM! 🙈'); mood.textContent='ops…'; snd.fart(); spawnMid('💨',3,true); setState('shy',1400,function(){ snd.giggle(); setState('laugh',700); }); },
  paw:function(){ say('Hihihi! 😹'); mood.textContent='cócegas no pé'; snd.giggle(); setState('laugh',800); },
  tail:function(){ say('MIAAAU! 😾'); mood.textContent='ai, meu rabo!'; V.angry(); setState('ouch',900); },
  nose:function(){ say('A-a-ATCHIM! 🤧'); mood.textContent='espirrou'; snd.sneeze(); setState('sneeze',700); },
  eye:function(){ say('Ei, meu olho! 🙀'); mood.textContent='pisca pisca'; snd.ouch(); setState('ouch',800); },
  slap:function(){ say('Ai! 😵'); mood.textContent='tonto…'; snd.ouch(); snd.dizzy(); spawnMid('💫',3); setState('dizzy',1500); }
};
function react(p,x,y){ if(wake())return; const r=srect();
  if(p==='belly'){ const now=performance.now(); bellyTaps=bellyTaps.filter(function(t){return now-t<1100}); bellyTaps.push(now);
    if(bellyTaps.length>=3){ bellyTaps=[]; spawn('💨',x-r.left,y-r.top,2); reactions.pum(); return; } }
  if(busy)return; spawn(p==='tail'||p==='hair'||p==='eye'||p==='slap'?'💢':'💛',x-r.left,y-r.top,2); (reactions[p]||reactions.head)(); }
function catDown(ev){ if(ev.pointerType==='mouse'&&ev.button!==0)return; ev.preventDefault(); audio();
  if(mode==='tramp'){ trampTap(); return; } if(mode==='goal')return;
  const part=ev.target&&ev.target.closest?ev.target.closest('[data-part]'):null; if(!part)return;
  try{ if(cat.setPointerCapture)cat.setPointerCapture(ev.pointerId); }catch(e){}
  down={x:ev.clientX,y:ev.clientY,t:performance.now(),part:part.getAttribute('data-part'),done:false}; }
function catMove(ev){ if(!down||down.done)return; const dx=ev.clientX-down.x,dy=ev.clientY-down.y; const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>70&&performance.now()-down.t<260&&(down.part==='head'||down.part==='eye'||down.part==='nose')){ down.done=true; react('slap',ev.clientX,ev.clientY); } }
function catUp(ev){ if(!down)return; const d=down; down=null; if(d.done)return; react(d.part,d.x,d.y); }
cat.addEventListener('pointerdown',catDown); cat.addEventListener('pointermove',catMove); cat.addEventListener('pointerup',catUp); cat.addEventListener('pointercancel',function(){down=null});
stage.addEventListener('touchstart',function(e){e.preventDefault()},{passive:false});
stage.addEventListener('pointerdown',function(ev){ if(mode==='tramp'&&ev.target!==cat&&!cat.contains(ev.target)){ audio(); trampTap(); } });

/* ================= actions ================= */
function showItem(emoji,ms){ item.textContent=emoji; item.style.display='block'; setTimeout(function(){item.style.display='none'},ms); }
const foods=[['🐟','chomp'],['🍎','crunch'],['🧁','chomp'],['🍕','chomp'],['🍪','crunch']]; let foodI=0;
$('b-food').onclick=function(){ audio(); if(wake()||busy)return; const f=foods[foodI++%foods.length]; mood.textContent='nham nham'; showItem(f[0],1500); snd[f[1]]();
  setState('eat',1500,function(){ if(Math.random()<.5){ say('BURP! 😸'); snd.burp(); } else { say('Hmmm! 😋'); snd.happy(); } spawnMid('✨',3); mood.textContent='satisfeito'; }); };
$('b-milk').onclick=function(){ audio(); if(wake()||busy)return; mood.textContent='glup glup'; showItem('🥛',1700); snd.slurp();
  setState('milk',1700,function(){ say('Ahhh! 🥛'); snd.happy(); cat.classList.add('stache'); extraT=setTimeout(function(){cat.classList.remove('stache')},2500); mood.textContent='bigode de leite'; }); };
$('b-bath').onclick=function(){ audio(); if(wake()||busy)return; mood.textContent='banho!'; showItem('🛁',2300); snd.splash(); say('Splash! 🫧');
  let n=0; const bub=setInterval(function(){ spawnMid('🫧',2,true); snd.bubbles(); if(++n>=4)clearInterval(bub); },500);
  setState('happy',2300,function(){ snd.shake(); spawnMid('💧',5); setState('shake',800,function(){ say('Limpinho! ✨'); snd.sparkle(); spawnMid('✨',4); mood.textContent='cheiroso'; }); }); };
$('b-dance').onclick=function(){ audio(); if(wake()||busy)return; mood.textContent='dançando'; say('Lá lá lá! 🎶'); const dur=snd.jingle();
  let n=0; const notes=setInterval(function(){ spawnMid(['🎵','🎶'][n%2],1); if(++n*0.45>dur)clearInterval(notes); },450);
  setState('dance',dur*1000,function(){ V.hi(); mood.textContent='ufa!'; }); };
$('b-sleep').onclick=function(){ audio(); if(sleeping){wake();return;} if(busy)return; sleeping=true; busy=false; rec=null; setCls('sleep'); mood.textContent='dormindo… toque para acordar'; say('Zzz… 💤',2500); snd.snore(); };

/* ================= mini games ================= */
function enterGame(type){ audio(); wake(); if(busy)return; mode=type; app.className=type; barHome.hidden=true; barGame.hidden=false; clearTimeout(timer); busy=false; setCls('idle'); item.style.display='none';
  game={type:type,ty:0,vy:0,jumps:0,boosted:false,score:0,flying:false,last:performance.now(),raf:0};
  if(type==='tramp'){ trampEl.style.display='block'; catbox.style.transform='translateY(-62px) scale(.82)'; scoreEl.textContent='Pulos: 0'; mood.textContent='toque para pular!'; say('Pula! 🤸'); game.raf=requestAnimationFrame(loop); }
  else { goalEl.style.display='block'; ballEl.style.display='block'; catbox.classList.add('goalpos'); scoreEl.textContent='Gols: 0'; mood.textContent='toque na bola!'; say('Chuta! ⚽'); } }
function leaveGame(){ if(game&&game.raf)cancelAnimationFrame(game.raf); game=null; mode='home'; app.className=''; barHome.hidden=false; barGame.hidden=true;
  trampEl.style.display='none'; goalEl.style.display='none'; ballEl.style.display='none'; ballEl.style.transform=''; catbox.style.transform=''; catbox.classList.remove('goalpos'); catwrap.classList.remove('hop'); setCls(restState()); mood.textContent=cur.mood; }
function squash(){ trampEl.classList.remove('squash'); void trampEl.offsetWidth; trampEl.classList.add('squash'); }
function trampTap(){ const g=game; if(!g)return;
  if(g.ty<8){ g.vy=1150; g.boosted=false; g.jumps++; snd.boing(); squash(); }
  else if(!g.boosted&&g.vy>0){ g.vy+=380; g.boosted=true; snd.boing2(); spawnMid('✨',2); }
  scoreEl.textContent='Pulos: '+g.jumps; }
function loop(now){ const g=game; if(!g||g.type!=='tramp')return; const dt=Math.min(.04,(now-g.last)/1000); g.last=now;
  if(g.ty>0||g.vy>0){ g.vy-=2400*dt; g.ty+=g.vy*dt;
    if(g.ty<=0){ g.ty=0; if(g.vy<-350){ g.vy=-g.vy*.55; g.jumps++; snd.boing(); squash(); scoreEl.textContent='Pulos: '+g.jumps; } else g.vy=0; g.boosted=false; } }
  catbox.style.transform='translateY('+(-62-g.ty)+'px) scale(.82)'; const inAir=g.ty>25; if(inAir&&getCls()!=='air')setCls('air'); if(!inAir&&getCls()==='air')setCls('idle');
  if(g.jumps>0&&g.jumps%10===0&&!g.cheered){ g.cheered=true; say('Uau! '+g.jumps+' pulos! 🎉'); snd.crowd(); spawnMid('🎉',4); } if(g.jumps%10!==0)g.cheered=false;
  g.raf=requestAnimationFrame(loop); }
function kick(ev){ if(ev)ev.preventDefault(); audio(); const g=game; if(!g||g.type!=='goal'||g.flying)return; g.flying=true; snd.kick();
  const st=srect(),gr=goalEl.getBoundingClientRect(),br=ballEl.getBoundingClientRect();
  const x0=br.left-st.left+br.width/2,y0=br.top-st.top+br.height/2; const goalIn=Math.random()<.75;
  const x1=gr.left-st.left+gr.width/2+(goalIn?(Math.random()*50-25):(gr.width/2+14)*(Math.random()<.5?-1:1)); const y1=gr.top-st.top+gr.height*.6;
  const T=720,t0=performance.now();
  setTimeout(function(){ catwrap.classList.remove('hop'); void catwrap.offsetWidth; catwrap.classList.add('hop'); setCls('air'); V.mew(); },T*.35);
  function anim(now){ const p=Math.min(1,(now-t0)/T); const x=x0+(x1-x0)*p,y=y0+(y1-y0)*p-Math.sin(p*Math.PI)*110;
    ballEl.style.transform='translate('+(x-x0)+'px,'+(y-y0)+'px) rotate('+(p*720)+'deg)'; if(p<1)requestAnimationFrame(anim); else land(); }
  function land(){ if(goalIn){ g.score++; scoreEl.textContent='Gols: '+g.score; say('GOOOL! ⚽',1500); snd.crowd(); snd.whistle(); spawn('🎉',x1,y1+40,5); setCls('laugh'); }
    else { say('Na trave! 😅'); snd.clank(); setCls('ouch'); }
    setTimeout(function(){ ballEl.style.transform=''; g.flying=false; if(game)setCls('idle'); },1000); }
  requestAnimationFrame(anim); }
$('b-tramp').onclick=function(){ enterGame('tramp'); };
$('b-goal').onclick=function(){ enterGame('goal'); };
$('b-back').onclick=function(){ audio(); leaveGame(); };
ballEl.addEventListener('pointerdown',kick);

/* ================= microphone: auto-listen or hold-to-talk, repeat in a squeaky voice ================= */
function noMic(msg){ say('Sem microfone 🙈',1600); mood.textContent=msg; }
async function micToggle(){
  if(stream){ micOff(); return; }
  audio();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ noMic('abra o link no Safari ou Chrome'); return; }
  micBtn.classList.add('wait'); mood.textContent='pedindo o microfone…';
  setSession('play-and-record');
  let s;
  try{ s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false}); }
  catch(e){ micBtn.classList.remove('wait'); setSession('playback'); noMic(e&&e.name==='NotAllowedError'?'microfone não liberado':'microfone indisponível'); return; }
  stream=s; audio();
  try{
    msrc=ac.createMediaStreamSource(stream); proc=ac.createScriptProcessor(2048,1,1); mute=ac.createGain(); mute.gain.value=0;
    msrc.connect(proc); proc.connect(mute); mute.connect(ac.destination); proc.onaudioprocess=onAudio;
  }catch(e){ micBtn.classList.remove('wait'); micOff(); noMic('microfone indisponível'); return; }
  listening=true; pre=[]; floor=0.01; micBtn.classList.remove('wait'); micBtn.classList.add('on'); micLabel.textContent='Ouvindo'; meter.classList.add('on');
  mood.textContent='fale com o Bigode!'; say('Fala comigo! 🎤',1500); V.mew();
  setTimeout(function(){ if(stream&&ac&&ac.state!=='running'){ audio(); mood.textContent='toque no gato para ligar o som'; } },400);
}
function micOff(){ listening=false; manual=false; rec=null;
  try{ stream.getTracks().forEach(function(t){t.stop()}); }catch(e){} stream=null;
  try{ proc.disconnect(); msrc.disconnect(); mute.disconnect(); }catch(e){} proc=msrc=mute=null;
  setSession('playback'); meter.classList.remove('on'); meterBar.style.transform='scaleX(0)';
  micBtn.classList.remove('on','wait','rec'); micLabel.textContent='Falar'; cat.classList.remove('listen'); mood.textContent=cur.mood; }
let holdT=null,held=false;
micBtn.addEventListener('pointerdown',function(ev){ if(ev.pointerType==='mouse'&&ev.button!==0)return; held=false; clearTimeout(holdT);
  if(!stream)return; holdT=setTimeout(function(){ held=true; manual=true; rec=[]; voiced=0; micBtn.classList.add('rec'); cat.classList.add('listen'); mood.textContent='pode falar…'; },350); });
function holdEnd(){ clearTimeout(holdT); if(manual){ manual=false; micBtn.classList.remove('rec'); if(rec&&rec.length)finish(true); else { rec=null; cat.classList.remove('listen'); } } }
micBtn.addEventListener('pointerup',holdEnd); micBtn.addEventListener('pointercancel',holdEnd); micBtn.addEventListener('pointerleave',holdEnd);
micBtn.addEventListener('click',function(){ if(held){ held=false; return; } micToggle(); });
function onAudio(e){
  const d=e.inputBuffer.getChannelData(0); let s=0; for(let i=0;i<d.length;i+=4)s+=d[i]*d[i]; const rms=Math.sqrt(s/(d.length/4));
  const now=performance.now(); if(now-lastMeter>60){ lastMeter=now; meterBar.style.transform='scaleX('+Math.min(1,rms*5)+')'; }
  if(manual){ if(rec){ rec.push(new Float32Array(d)); voiced++; } return; }
  if(!listening||playing||sleeping||now<quietUntil){ if(rec){ rec=null; cat.classList.remove('listen'); } speech=0; return; }
  const thr=Math.max(0.015,floor*2.5);
  if(!rec){
    pre.push(new Float32Array(d)); if(pre.length>3)pre.shift();
    if(rms>thr){ speech++; if(speech>=2){ rec=pre.slice(); pre=[]; silence=0; voiced=speech; cat.classList.add('listen'); mood.textContent='ouvindo você…'; } }
    else { speech=0; floor=floor*0.95+rms*0.05; }
  } else {
    rec.push(new Float32Array(d));
    if(rms<thr*0.6){ silence++; } else { silence=0; voiced++; }
    if(silence>=16) finish(false); else if(rec.length>=180) finish(true);
  }
}
function finish(byMax){ const chunks=rec; rec=null; speech=0; silence=0; cat.classList.remove('listen');
  if(!chunks||voiced<4){ mood.textContent='fale com o Bigode!'; return; }
  const keep=byMax?chunks.length:Math.max(4,chunks.length-12);
  let len=0; for(let i=0;i<keep;i++)len+=chunks[i].length;
  let buf; try{ buf=ac.createBuffer(1,len,ac.sampleRate); }catch(e){ return; }
  const out=buf.getChannelData(0); let off=0; for(let i=0;i<keep;i++){ out.set(chunks[i],off); off+=chunks[i].length; }
  let peak=0; for(let i=0;i<len;i++){ const v=Math.abs(out[i]); if(v>peak)peak=v; }
  if(peak>0.001&&peak<0.7){ const g=0.7/peak; for(let i=0;i<len;i++)out[i]*=g; }
  playBack(buf);
}
function playBack(buf){ audio(); let src; try{ src=ac.createBufferSource(); src.buffer=buf; src.playbackRate.value=cur.rate;
    const g=ac.createGain(); g.gain.value=1.3; src.connect(g); g.connect(master); src.start(); }catch(e){ return; }
  playing=true; busy=true; clearTimeout(timer); setCls('talk'); mood.textContent='repetindo! 😸'; spawnMid('🎶',3);
  const dur=buf.duration/cur.rate; let ended=false;
  function done(){ if(ended)return; ended=true; playing=false; busy=false; setCls(restState()); quietUntil=performance.now()+500; mood.textContent='fale com o Bigode!'; }
  src.onended=done; setTimeout(done,dur*1000+250);
}

/* ================= idle life ================= */
setInterval(function(){ if(sleeping){ snd.snore(); const s=srect(); spawn('💤',s.width*.6,s.height*.3,1,true); return;}
  if(!busy){ cat.classList.add('blink'); setTimeout(function(){cat.classList.remove('blink')},150);} },2800);
setInterval(function(){ if(busy||sleeping||rec||mode!=='home')return; const r=Math.random();
  if(r<.3){ say(cur.hello,900); V.hi(); } else if(r<.45){ say('Aaaah… 🥱',900); snd.yawn(); setState('yawn',900); } },9000);
})();
