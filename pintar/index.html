<style>
/* Layout: art table. Header (title + drawing picker), square canvas, tool strip, colour grid, size slider. Gallery overlay. */
:root{
  --bg:#fff4e6; --paper:#ffffff; --fg:#3b2412; --panel:#ffe2bf; --panel2:#ffd29a; --accent:#ff6b3d; --shadow:rgba(120,60,0,.22);
  --display:'Baloo 2','Comic Sans MS',cursive; --body:'Nunito',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#2a1f2e; --fg:#fff1e0; --panel:#3c2d44; --panel2:#4d3a57; --shadow:rgba(0,0,0,.45); color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#2a1f2e; --fg:#fff1e0; --panel:#3c2d44; --panel2:#4d3a57; --shadow:rgba(0,0,0,.45); color-scheme:dark }
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:6px;box-sizing:border-box;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px 10px}
header{display:flex;align-items:center;gap:8px}
h1{margin:0;font-family:var(--display);font-size:1.35rem;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 span{color:var(--accent)}
.btn{border:0;border-radius:14px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;font-size:.95rem;padding:7px 12px;box-shadow:0 3px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:4px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--shadow)}
.btn.big{background:var(--accent);color:#fff}
#board{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;aspect-ratio:1/1;height:100%;max-width:100%;background:var(--paper);border-radius:18px;box-shadow:0 6px 0 var(--shadow);overflow:hidden;touch-action:none}
#frame canvas{position:absolute;inset:0;width:100%;height:100%}
#lines{pointer-events:none}
#tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
#tools::-webkit-scrollbar,#colors::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;border:0;border-radius:14px;background:var(--panel);color:var(--fg);font-family:var(--display);font-weight:800;font-size:.68rem;width:62px;padding:5px 0 4px;box-shadow:0 3px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;cursor:pointer;line-height:1.1}
.tool span{font-size:1.45rem}
.tool.on{background:var(--accent);color:#fff;transform:translateY(-2px)}
#colors{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,34px);grid-auto-columns:34px;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
.sw{border:3px solid rgba(0,0,0,.12);border-radius:50%;cursor:pointer;padding:0}
.sw.on{outline:4px solid var(--fg);outline-offset:1px}
.sw.rb{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)}
#sizerow{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:.85rem}
#size{flex:1;accent-color:var(--accent)}
#dot{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
#dot i{display:block;border-radius:50%;background:#333}
#gallery{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;gap:8px;box-sizing:border-box;padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
#cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.cat{flex:0 0 auto}
.cat.on{background:var(--accent);color:#fff}
#grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;align-content:start;padding:2px 2px 20px}
.card{background:#fff;border:0;border-radius:16px;box-shadow:0 3px 0 var(--shadow);padding:6px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:800;font-size:.8rem;color:#3b2412}
.card svg{width:100%;aspect-ratio:1/1}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:800;padding:5px 14px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5;white-space:nowrap}
#toast.on{opacity:1}
.btn:focus-visible,.tool:focus-visible,.sw:focus-visible,.card:focus-visible{outline:3px solid var(--accent)}
@media (max-width:430px){h1{font-size:1.1rem}.btn{padding:7px 9px;font-size:.85rem}header{gap:5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function T(x,y,s,fs){return '<text x="'+x+'" y="'+y+'" font-size="'+fs+'" text-anchor="middle" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900">'+s+'</text>'}
function pol(cx,cy,r,deg){const a=deg*Math.PI/180;return [ (cx+r*Math.cos(a)).toFixed(1), (cy+r*Math.sin(a)).toFixed(1) ]}
function petals(cx,cy,r,n,rx,ry,off){let s='';for(let i=0;i<n;i++){const d=(off||0)+360/n*i;const p=pol(cx,cy,r,d);s+=E(p[0],p[1],rx,ry,d.toFixed(1))}return s}
function dots(cx,cy,r,n,cr,off){let s='';for(let i=0;i<n;i++){const p=pol(cx,cy,r,(off||0)+360/n*i);s+=C(p[0],p[1],cr)}return s}
function diamonds(cx,cy,r1,r2,n,w,off){let s='';for(let i=0;i<n;i++){const d=(off||0)+360/n*i;const a=pol(cx,cy,r1,d),b=pol(cx,cy,(r1+r2)/2,d-w),c=pol(cx,cy,r2,d),e=pol(cx,cy,(r1+r2)/2,d+w);s+=P('M'+a+' L'+b+' L'+c+' L'+e+' Z')}return s}
function mandala(k){const n=[6,8,10,12,8,6,10,12,16,8][k];let s=C(50,50,46)+C(50,50,7+k%3*2);const h=180/n;
  if(k%3===0)s+=petals(50,50,22,n,13,6)+dots(50,50,38,n,6,h);
  else if(k%3===1)s+=diamonds(50,50,10,34,n,Math.min(14,120/n))+petals(50,50,40,n,5,3,0);
  else s+=dots(50,50,20,n,7)+petals(50,50,34,n,9,5,h);
  if(k>=5)s+=C(50,50,30);
  if(k>=7)s+=dots(50,50,44,n*2,2.5,h/2);
  return s}
function snowflake(){let s=C(50,50,8);for(let i=0;i<6;i++){const d=i*60;const a=pol(50,50,26,d);s+=E(a[0],a[1],17,3.5,d);const t=pol(50,50,44,d);s+=C(t[0],t[1],4);
  const b1=pol(50,50,32,d-18),b2=pol(50,50,32,d+18);s+=E(b1[0],b1[1],6,2.5,d-50)+E(b2[0],b2[1],6,2.5,d+50)}return s}

/* ---------- audio + voice clips (play even on silent mode) ---------- */
const silent=$('silent'); let ac=null,master=null;
function audio(){ try{ if(!ac){ const C2=window.AudioContext||window.webkitAudioContext; if(!C2)return null; ac=new C2(); master=ac.createGain(); master.gain.value=1; master.connect(ac.destination); } if(ac.state!=='running')ac.resume().catch(function(){}); }catch(e){} return ac; }
['pointerup','touchend','click'].forEach(function(t){ document.addEventListener(t,function(){ const a=audio(); if(!a)return; try{ const s=a.createBufferSource(); s.buffer=a.createBuffer(1,1,22050); s.connect(a.destination); s.start(0); }catch(e){} if(silent.paused){ try{ const p=silent.play(); if(p&&p.catch)p.catch(function(){}); }catch(e){} } },{passive:true}); });
function tone(f1,f2,dur,type,vol,delay){ const a=audio(); if(!a)return; const t=a.currentTime+(delay||0); try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.25,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.05); }catch(e){} }
const sndPop=function(){ tone(500,900,.12,'sine',.3); tone(900,1300,.1,'triangle',.18,.06); };
const sndTick=function(){ tone(1200,1000,.05,'square',.08); };
const CLIPS=window.CLIPS||{}; const cache={}; let clipSrc=null;
function speak(text){ const a=audio(); const e=CLIPS[text]; if(!a||!e)return; const uri=e[Object.keys(e)[0]];
  function play(buf){ try{ if(clipSrc)clipSrc.stop(); }catch(x){} const s=a.createBufferSource(); s.buffer=buf; s.playbackRate.value=1.5; const g=a.createGain(); g.gain.value=1.5; s.connect(g); g.connect(master); s.start(); clipSrc=s; }
  if(cache[text])return play(cache[text]);
  try{ const b=atob(uri.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); a.decodeAudioData(u.buffer,function(buf){ cache[text]=buf; play(buf); },function(){}); }catch(x){} }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(function(){el.classList.remove('on')},1300); }

const N=1000, paint=$('paint'), lines=$('lines'), pc=paint.getContext('2d',{willReadFrequently:true}), lc=lines.getContext('2d',{willReadFrequently:true});
let lineMask=null, cur=0, undo=[];
function snapshot(){ try{ undo.push(pc.getImageData(0,0,N,N)); if(undo.length>15)undo.shift(); }catch(e){} }
function clearPaint(){ pc.globalCompositeOperation='source-over'; pc.fillStyle='#ffffff'; pc.fillRect(0,0,N,N); }
function loadArt(i){ cur=i; undo=[]; clearPaint(); lc.clearRect(0,0,N,N); lineMask=null;
  const img=new Image(); img.onload=function(){ lc.drawImage(img,0,0,N,N); try{ const d=lc.getImageData(0,0,N,N).data; lineMask=new Uint8Array(N*N); for(let p=0,j=3;p<N*N;p++,j+=4)lineMask[p]=d[j]>70?1:0; }catch(e){} };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgOf(i,N,2));
  try{ localStorage.setItem('atelie-art',String(i)); }catch(e){} }

function curColor(){ if(color==='rainbow'||tool==='arco'){ hue=(hue+4)%360; return 'hsl('+hue+',90%,55%)'; } return color; }
function radius(){ const base={lapis:3,caneta:7,canetao:18,giz:12,pincel:16,marca:22,spray:26,glitter:20,arco:14,estrela:22,borracha:22}[tool]||10; return base*(0.4+sizeV*0.18); }

function pos(ev){ const r=paint.getBoundingClientRect(); return {x:(ev.clientX-r.left)/r.width*N, y:(ev.clientY-r.top)/r.height*N}; }
let drawing=false, last=null;
function dab(x,y){ const r=radius(); pc.globalCompositeOperation=tool==='borracha'?'destination-out':(tool==='marca'?'multiply':'source-over');
  if(tool==='borracha'){ pc.globalCompositeOperation='source-over'; pc.fillStyle='#ffffff'; pc.beginPath(); pc.arc(x,y,r,0,7); pc.fill(); return; }
  if(tool==='spray'){ pc.fillStyle=curColor(); for(let i=0;i<22;i++){ const a=Math.random()*6.283,d=Math.random()*r; pc.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,2.4,2.4); } return; }
  if(tool==='glitter'){ for(let i=0;i<10;i++){ const a=Math.random()*6.283,d=Math.random()*r; pc.fillStyle=Math.random()<.35?'#ffffff':(Math.random()<.5?'#ffd700':curColor()); pc.beginPath(); pc.arc(x+Math.cos(a)*d,y+Math.sin(a)*d,1+Math.random()*2.6,0,7); pc.fill(); } return; }
  if(tool==='giz'){ pc.fillStyle=curColor(); for(let i=0;i<30;i++){ const a=Math.random()*6.283,d=Math.sqrt(Math.random())*r; if(Math.random()<.8)pc.fillRect(x+Math.cos(a)*d,y+Math.sin(a)*d,3,3); } return; }
  if(tool==='estrela'){ star(x,y,r,curColor()); return; }
  pc.fillStyle=curColor(); pc.globalAlpha=tool==='marca'?.35:(tool==='lapis'?.85:1); pc.beginPath(); pc.arc(x,y,r,0,7); pc.fill(); pc.globalAlpha=1; }
function star(x,y,r,col){ pc.globalCompositeOperation='source-over'; pc.fillStyle=col; pc.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r*.45:r; pc.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } pc.closePath(); pc.fill(); }
function strokeTo(p){ if(tool==='estrela'){ if(!last||Math.hypot(p.x-last.x,p.y-last.y)>radius()*2.2){ dab(p.x,p.y); last=p; } return; }
  const step=Math.max(1.5,radius()*(tool==='spray'||tool==='glitter'||tool==='giz'?.6:.35)); const dx=p.x-last.x,dy=p.y-last.y,dist=Math.hypot(dx,dy); const n=Math.max(1,Math.ceil(dist/step));
  for(let i=1;i<=n;i++)dab(last.x+dx*i/n,last.y+dy*i/n); last=p; }
paint.addEventListener('pointerdown',function(ev){ ev.preventDefault(); audio(); const p=pos(ev);
  if(tool==='balde'){ snapshot(); fill(Math.round(p.x),Math.round(p.y)); return; }
  try{ paint.setPointerCapture(ev.pointerId); }catch(e){} snapshot(); drawing=true; last=p; dab(p.x,p.y); });
paint.addEventListener('pointermove',function(ev){ if(!drawing)return; const evs=ev.getCoalescedEvents?ev.getCoalescedEvents():[ev]; for(let i=0;i<evs.length;i++)strokeTo(pos(evs[i])); });
function endStroke(){ drawing=false; last=null; pc.globalCompositeOperation='source-over'; pc.globalAlpha=1; }
paint.addEventListener('pointerup',endStroke); paint.addEventListener('pointercancel',endStroke);
$('frame').addEventListener('touchstart',function(e){ e.preventDefault(); },{passive:false});

/* ---------- bucket fill (bounded by the line art) ---------- */
function hexToRgb(c){ const t=document.createElement('canvas').getContext('2d'); t.fillStyle=c; const s=t.fillStyle; if(s[0]==='#'){ return [parseInt(s.slice(1,3),16),parseInt(s.slice(3,5),16),parseInt(s.slice(5,7),16)]; } const m=s.match(/\d+/g); return m?[+m[0],+m[1],+m[2]]:[0,0,0]; }
function fill(x,y){ if(x<0||y<0||x>=N||y>=N)return; const id=pc.getImageData(0,0,N,N), d=id.data; const start=y*N+x;
  if(lineMask&&lineMask[start]){ toast('toque dentro do desenho'); return; }
  const sr=d[start*4],sg=d[start*4+1],sb=d[start*4+2]; const rgb=hexToRgb(curColor()); const rainbow=(color==='rainbow');
  if(!rainbow&&Math.abs(sr-rgb[0])+Math.abs(sg-rgb[1])+Math.abs(sb-rgb[2])<6)return;
  const tol=60; const seen=new Uint8Array(N*N); const stack=[start]; let count=0;
  function ok(p){ if(seen[p])return false; if(lineMask&&lineMask[p])return false; const j=p*4; return Math.abs(d[j]-sr)+Math.abs(d[j+1]-sg)+Math.abs(d[j+2]-sb)<=tol; }
  while(stack.length){ let p=stack.pop(); let px=p%N, py=(p-px)/N; let l=px; while(l>0&&ok(py*N+l-1))l--; let r=px; while(r<N-1&&ok(py*N+r+1))r++;
    let up=false,dn=false;
    for(let i=l;i<=r;i++){ const q=py*N+i; seen[q]=1; count++; const j=q*4;
      let c=rgb; if(rainbow){ const h=((i+py)*0.6)%360; c=hslToRgb(h/360,.9,.55); }
      d[j]=c[0]; d[j+1]=c[1]; d[j+2]=c[2]; d[j+3]=255;
      if(py>0){ const u=q-N; if(ok(u)){ if(!up){ stack.push(u); up=true; } } else up=false; }
      if(py<N-1){ const w=q+N; if(ok(w)){ if(!dn){ stack.push(w); dn=true; } } else dn=false; } } }
  // grow 2px under the anti-aliased lines so no white halo remains
  if(lineMask){ for(let pass=0;pass<2;pass++){ const add=[]; for(let p=N;p<N*N-N;p++){ if(seen[p]||!lineMask[p])continue; if(seen[p-1]||seen[p+1]||seen[p-N]||seen[p+N])add.push(p); }
    for(let k=0;k<add.length;k++){ const p=add[k]; seen[p]=1; const j=p*4; let c=rgb; if(rainbow){ const px=p%N,py=(p-px)/N; c=hslToRgb((((px+py)*0.6)%360)/360,.9,.55); } d[j]=c[0]; d[j+1]=c[1]; d[j+2]=c[2]; } } }
  pc.putImageData(id,0,0); sndPop(); }
function hslToRgb(h,s,l){ function f(n){ const k=(n+h*12)%12, a=s*Math.min(l,1-l); return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))); } return [f(0),f(8),f(4)]; }

/* ---------- header buttons ---------- */
$('b-undo').onclick=function(){ const s=undo.pop(); if(s){ pc.putImageData(s,0,0); sndTick(); } else toast('nada para desfazer'); };
$('b-clear').onclick=function(){ snapshot(); clearPaint(); sndTick(); toast('folha limpa! (↩️ desfaz)'); };
$('b-save').onclick=function(){ const out=document.createElement('canvas'); out.width=N; out.height=N; const o=out.getContext('2d'); o.drawImage(paint,0,0); o.drawImage(lines,0,0);
  try{ out.toBlob(function(b){ if(!b)return; const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='desenho-'+ART[cur][1].toLowerCase()+'.png'; document.body.appendChild(a); a.click(); a.remove(); toast('salvando…'); }); }catch(e){ toast('segure o dedo no desenho para salvar'); } };

/* ---------- gallery ---------- */
let catSel='todos';
function buildGallery(){ const cats=$('cats'); cats.innerHTML=''; CATS.forEach(function(c){ const b=document.createElement('button'); b.className='btn cat'+(c===catSel?' on':''); b.textContent=c[0].toUpperCase()+c.slice(1); b.onclick=function(){ catSel=c; buildGallery(); sndTick(); }; cats.appendChild(b); });
  const g=$('grid'); g.innerHTML=''; ART.forEach(function(a,i){ if(catSel!=='todos'&&a[0]!==catSel)return; const b=document.createElement('button'); b.className='card'; b.innerHTML=svgOf(i,null,3)+a[1];
    b.onclick=function(){ loadArt(i); $('gallery').hidden=true; sndPop(); speak(a[1]); }; g.appendChild(b); }); }
$('b-pick').onclick=function(){ buildGallery(); $('gallery').hidden=false; sndTick(); };
$('b-close').onclick=function(){ $('gallery').hidden=true; };

buildTools(); buildColors(); updateDot();
(function(){ let i=0; try{ i=+(localStorage.getItem('atelie-art')||0)||0; }catch(e){} loadArt(Math.min(i,ART.length-1)); })();
})();
